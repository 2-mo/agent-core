[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-core"
version = "0.1.0"
description = "Explicit conversations, validated tools, and bounded agent execution."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "2-mo"}]
dependencies = [
  "httpx>=0.27,<1",
  "jsonschema>=4.26,<5",
  "json-repair>=0.63.3,<1",
]

[project.urls]
Repository = "https://github.com/2-mo/agent-core"
Issues = "https://github.com/2-mo/agent-core/issues"

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
